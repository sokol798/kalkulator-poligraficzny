<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<title>Aplikacja — Nowy format</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap">
<style>
body{margin:0;background:#eceff2;color:#111111;font-family:Inter,system-ui,sans-serif}
a{color:#111111;text-decoration:none}a:hover{color:#5c6670}
input,button{font-family:inherit}
input{box-sizing:border-box;background:#eceff2;border:1px solid #eceff2;border-radius:12px;padding:12px 14px;font-size:17px;font-weight:500;color:#111111;outline:none;width:100%;min-height:50px}
input:focus{border-color:#111111}
.lbl{font-size:13px;line-height:18px;color:#5c6670;font-weight:500}
.card{background:#ffffff;border-radius:16px;padding:16px;box-sizing:border-box}
.icobtn{width:44px;height:44px;border-radius:999px;border:0;background:#ffffff;display:flex;align-items:center;justify-content:center}
.chip{border:1px solid #dbe0e5;background:#ffffff;color:#111111;border-radius:999px;padding:8px 14px;font-size:13px;font-weight:500;min-height:36px}
.chip.on{background:#111111;color:#ffffff;border-color:#111111}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: #eceff2; overflow: hidden; padding: 0 16px;">

  <header style="display: flex; align-items: center; justify-content: space-between; padding: 56px 0 14px;">
    <a href="App_Formaty.dc.html" class="icobtn" aria-label="Anuluj"><svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><path d="M2 2l10 10M12 2 2 12" stroke="#111111" stroke-width="1.6"/></svg></a>
    <span style="font-size: 16px; font-weight: 600;">Nowy format</span>
    <span style="width: 44px;"></span>
  </header>

  <form style="display: flex; flex-direction: column; gap: 10px;">
    <div class="card" style="display: flex; flex-direction: column; gap: 10px;">
      <div style="display: flex; justify-content: space-between; align-items: center;"><label for="w" class="lbl" style="color: #111111; font-weight: 600;">Wymiar netto</label><span class="lbl">mm</span></div>
      <div style="display: grid; grid-template-columns: minmax(0, 1fr) 20px minmax(0, 1fr); gap: 8px; align-items: center;">
        <input id="w" type="text" value="150" aria-label="Szerokość" style="text-align: center; font-size: 20px; font-weight: 600;"><span style="text-align: center; color: #5c6670;">×</span><input type="text" value="150" aria-label="Wysokość" style="text-align: center; font-size: 20px; font-weight: 600;">
      </div>
      <div style="display: flex; gap: 6px; flex-wrap: wrap;">
        <button type="button" class="chip">A4</button><button type="button" class="chip">A5</button><button type="button" class="chip">A6</button><button type="button" class="chip">DL</button><button type="button" class="chip on">Własny</button>
      </div>
    </div>

    <div class="card" style="display: flex; flex-direction: column; gap: 8px;">
      <label for="n" class="lbl">Nazwa <span style="font-weight: 400;">(opcjonalnie)</span></label>
      <input id="n" type="text" placeholder="np. Zaproszenie kwadrat">
    </div>

    <div class="card" style="display: flex; flex-direction: column; gap: 8px;">
      <label for="b" class="lbl">Spady <span style="font-weight: 400;">(domyślnie 3 mm)</span></label>
      <div style="display: flex; gap: 6px;">
        <button type="button" class="chip">0</button><button type="button" class="chip">2</button><button type="button" class="chip on">3</button><button type="button" class="chip">5</button><input id="b" type="text" placeholder="inne" style="width: 90px; min-height: 36px; padding: 6px 12px; font-size: 13px; border-radius: 999px;">
      </div>
    </div>
  </form>

  <div class="card" style="margin-top: 10px; display: flex; align-items: center; gap: 16px; padding: 14px 16px;">
    <div style="width: 52px; height: 52px; background: #eceff2; border: 1px solid #dbe0e5; border-radius: 3px; box-sizing: border-box;" aria-hidden="true"></div>
    <div style="flex: 1;"><div class="lbl">Podgląd</div><div style="font-size: 15px; font-weight: 500;">150 × 150 mm · ze spadami 156 × 156</div><div class="lbl" style="font-size: 12px;">Na B2 zmieści się 12 użytków</div></div>
  </div>

  <div style="margin-top: auto; padding-bottom: 24px; display: flex; gap: 8px;">
    <a href="App_Kalkulator.dc.html" style="flex: 1; display: flex; align-items: center; justify-content: center; background: #111111; color: #ffffff; border-radius: 999px; padding: 14px; font-size: 15px; font-weight: 600; min-height: 50px; box-sizing: border-box;">Zapisz i użyj</a>
    <a href="App_Formaty.dc.html" style="display: flex; align-items: center; background: #ffffff; border: 1px solid #dbe0e5; border-radius: 999px; padding: 14px 18px; font-size: 15px; font-weight: 500; min-height: 50px; box-sizing: border-box;">Zapisz</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
