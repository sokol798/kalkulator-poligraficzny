name: Deploy web to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run core:test
      - run: npx expo export --platform web --output-dir dist
        working-directory: apps/app
        env:
          EXPO_NO_TELEMETRY: '1'
      - run: cp apps/app/dist/index.html apps/app/dist/404.html && touch apps/app/dist/.nojekyll
      # Publikacja do gałęzi gh-pages, z której serwowane jest GitHub Pages tego repozytorium.
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: apps/app/dist
          publish_branch: gh-pages
          force_orphan: true
