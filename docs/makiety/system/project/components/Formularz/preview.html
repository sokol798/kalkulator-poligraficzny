<!-- @dsCard group="Propozycje" height=420 width=560 subtitle="Propozycja 5 — miękka, przyjazna, DM Sans, zieleń" -->
<!doctype html>
<html lang="pl"><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&display=swap">
<style>
  html,body{margin:0;background:var(--p5-bg);color:var(--p5-ink);font-family:var(--font-dmsans)}
  .page{padding:var(--space-5);box-sizing:border-box;width:560px}
  .card{background:var(--p5-surface);border:1px solid var(--p5-border);border-radius:var(--radius-lg);padding:var(--space-5)}
  h1{font:700 20px/28px var(--font-dmsans);margin:0 0 var(--space-1)}
  .lead{font-size:14px;line-height:20px;color:var(--p5-muted);margin:0 0 var(--space-4)}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:var(--space-3)}
  .field{border:1px solid var(--p5-border);border-radius:var(--radius-lg);padding:var(--space-2) var(--space-3)}
  .label{font-size:13px;line-height:18px;color:var(--p5-muted);font-weight:500}
  .value{font-size:16px;line-height:24px;font-weight:500}
  .value small{color:var(--p5-muted);font-weight:400}
  .result{display:flex;justify-content:space-between;align-items:center;margin-top:var(--space-4);background:var(--p5-bg);border-radius:var(--radius-lg);padding:var(--space-4) var(--space-5)}
  .big{font-size:44px;line-height:52px;font-weight:700;color:var(--p5-accent)}
  .big small{font-size:16px;color:var(--p5-ink);margin-left:var(--space-2);font-weight:500}
  .sub{font-size:14px;line-height:20px;color:var(--p5-muted)}
  .btn{background:var(--p5-accent);color:#fff;border:0;border-radius:var(--radius-pill);padding:var(--space-3) var(--space-5);font:700 14px/20px var(--font-dmsans)}
</style></head><body>
<div class="page"><div class="card">
  <h1>Kalkulator poligraficzny</h1>
  <p class="lead">Podaj format i arkusz — policzymy, ile arkuszy potrzebujesz.</p>
  <div class="grid">
    <div class="field"><div class="label">Format netto</div><div class="value">210 × 297 <small>mm</small></div></div>
    <div class="field"><div class="label">Spady</div><div class="value">3 <small>mm</small></div></div>
    <div class="field"><div class="label">Arkusz drukarski</div><div class="value">B2 · 500 × 700 <small>mm</small></div></div>
    <div class="field"><div class="label">Nakład</div><div class="value">1 000 <small>szt.</small></div></div>
  </div>
  <div class="result">
    <div><div class="big">125<small>arkuszy</small></div><div class="sub">8 użytków na arkuszu · odpad 11 %</div></div>
    <button class="btn">Przelicz</button>
  </div>
</div></div>
</body></html>
