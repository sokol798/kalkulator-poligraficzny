<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<title>Aplikacja — Kalkulator</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap">
<style>
body{margin:0;background:#eceff2;color:#111111;font-family:Inter,system-ui,sans-serif}
a{color:#111111;text-decoration:none}a:hover{color:#5c6670}
input,select,button{font-family:inherit}
input{box-sizing:border-box;background:#eceff2;border:1px solid #eceff2;border-radius:12px;padding:12px 14px;font-size:20px;font-weight:600;color:#111111;outline:none;width:100%;min-height:52px;text-align:center}
input:focus{border-color:#111111}
.lbl{font-size:13px;line-height:18px;color:#5c6670;font-weight:500}
.card{background:#ffffff;border-radius:16px;padding:14px 16px;box-sizing:border-box}
.chip{border:1px solid #dbe0e5;background:#ffffff;color:#111111;border-radius:999px;padding:9px 14px;font-size:14px;font-weight:500;min-height:40px}
.chip.on{background:#111111;color:#ffffff;border-color:#111111}
.icobtn{width:44px;height:44px;border-radius:999px;border:0;background:#ffffff;display:flex;align-items:center;justify-content:center}
.step{width:52px;height:52px;border-radius:12px;border:0;background:#eceff2;font-size:22px;font-weight:500;color:#111111}
.seg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));background:#eceff2;border-radius:999px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;border-radius:999px;padding:8px;font-size:13px;font-weight:500;color:#5c6670;min-height:36px}
.seg button.on{background:#ffffff;color:#111111}
.tabs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));background:#ffffff;border-radius:20px;padding:6px;gap:2px}
.tab{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 4px;border-radius:14px;font-size:11px;font-weight:500;color:#5c6670;min-height:52px;box-sizing:border-box;justify-content:center}
.tab.on{background:#111111;color:#ffffff}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: #eceff2; overflow: hidden; padding: 0 16px;">

  <header style="display: flex; align-items: center; justify-content: space-between; padding: 56px 0 14px;">
    <span style="font-size: 20px; font-weight: 600;">Kalkulator</span>
    <a href="App_Ustawienia.dc.html" class="icobtn" aria-label="Ustawienia"><svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><circle cx="9" cy="9" r="2.5" fill="none" stroke="#111111" stroke-width="1.5"/><path d="M9 1.5v2M9 14.5v2M1.5 9h2M14.5 9h2M3.7 3.7l1.4 1.4M12.9 12.9l1.4 1.4M3.7 14.3l1.4-1.4M12.9 5.1l1.4-1.4" stroke="#111111" stroke-width="1.5"/></svg></a>
  </header>

  <form style="display: flex; flex-direction: column; gap: 10px;">
    <div class="card" style="display: flex; flex-direction: column; gap: 10px;">
      <div style="display: flex; gap: 6px; overflow: hidden;">
        <button type="button" class="chip on">A5</button><button type="button" class="chip">A4</button><button type="button" class="chip">A6</button><button type="button" class="chip">DL</button><a href="App_WyborFormatu.dc.html" class="chip" style="display: inline-flex; align-items: center; gap: 4px; border-style: dashed;">Więcej <svg width="10" height="10" viewBox="0 0 10 10" aria-hidden="true"><path d="M1 3l4 4 4-4" fill="none" stroke="#111111" stroke-width="1.5"/></svg></a>
      </div>
      <div style="display: grid; grid-template-columns: minmax(0, 1fr) 24px minmax(0, 1fr); gap: 6px; align-items: center;">
        <div><input id="w" type="text" value="148" aria-label="Szerokość w mm"><div class="lbl" style="text-align: center; margin-top: 4px; font-size: 12px;">szerokość mm</div></div>
        <span style="text-align: center; color: #5c6670; font-size: 18px; margin-bottom: 20px;">×</span>
        <div><input id="h" type="text" value="210" aria-label="Wysokość w mm"><div class="lbl" style="text-align: center; margin-top: 4px; font-size: 12px;">wysokość mm</div></div>
      </div>
    </div>

    <div style="display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 10px;">
      <div class="card" style="display: flex; flex-direction: column; gap: 8px;">
        <label for="q" class="lbl">Nakład (szt.)</label>
        <div style="display: flex; gap: 4px; align-items: center;">
          <button type="button" class="step" aria-label="Mniej o 100" style="width: 40px; height: 44px;">−</button>
          <input id="q" type="text" value="1 000" style="min-height: 44px; font-size: 17px; padding: 8px 4px;">
          <button type="button" class="step" aria-label="Więcej o 100" style="width: 40px; height: 44px;">+</button>
        </div>
      </div>
      <div class="card" style="display: flex; flex-direction: column; gap: 8px;">
        <span class="lbl">Arkusz</span>
        <div style="display: flex; gap: 4px; flex-wrap: wrap;">
          <button type="button" class="chip on" style="padding: 8px 12px; min-height: 36px; font-size: 13px;">B2</button>
          <button type="button" class="chip" style="padding: 8px 12px; min-height: 36px; font-size: 13px;">B1</button>
          <a href="App_WyborArkusza.dc.html" class="chip" style="display: inline-flex; align-items: center; gap: 4px; padding: 8px 12px; min-height: 36px; font-size: 13px; border-style: dashed;">Więcej <svg width="10" height="10" viewBox="0 0 10 10" aria-hidden="true"><path d="M1 3l4 4 4-4" fill="none" stroke="#111111" stroke-width="1.5"/></svg></a>
        </div>
      </div>
    </div>

    <div class="card" style="display: flex; align-items: center; gap: 10px; padding: 10px 16px;">
      <span class="lbl" style="flex-shrink: 0;">Papier g/m²</span>
      <div style="display: flex; gap: 4px; flex: 1; justify-content: flex-end;">
        <button type="button" class="chip" style="padding: 8px 10px; min-height: 36px; font-size: 13px;">80</button>
        <button type="button" class="chip on" style="padding: 8px 10px; min-height: 36px; font-size: 13px;">130</button>
        <button type="button" class="chip" style="padding: 8px 10px; min-height: 36px; font-size: 13px;">170</button>
        <button type="button" class="chip" style="padding: 8px 10px; min-height: 36px; font-size: 13px;">300</button>
        <input type="text" placeholder="inna" aria-label="Inna gramatura" style="width: 56px; min-height: 36px; padding: 6px 8px; font-size: 13px; border-radius: 999px; font-weight: 500;">
      </div>
    </div>

    <a href="App_Ustawienia.dc.html" class="lbl" style="display: flex; justify-content: space-between; padding: 0 6px; font-size: 13px;"><span>Spady 3 mm · chwyt 10 mm · orientacja auto</span><span style="color: #111111; font-weight: 600;">Zmień</span></a>
  </form>

  <section class="card" style="margin-top: 6px; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px;">
    <div style="display: flex; justify-content: space-between; align-items: center; gap: 12px;">
      <div>
        <div class="lbl">Potrzebujesz</div>
        <div style="font-size: 60px; line-height: 1; font-weight: 600; letter-spacing: -0.04em; margin-top: 4px;">112</div>
        <div style="font-size: 15px; font-weight: 500; margin-top: 6px;">arkuszy B2 <span class="lbl">· 9 na arkuszu · 86 %</span></div>
        <div style="font-size: 15px; font-weight: 500; margin-top: 4px;">≈ 5,1 kg papieru <span class="lbl">· 4,0 g / szt. · 4,0 kg nakład</span></div>
      </div>
      <a href="App_Karta.dc.html" aria-label="Zobacz rozkład na arkuszu" style="width: 86px; height: 120px; background: #eceff2; border-radius: 8px; box-sizing: border-box; padding: 7px 5px 5px; position: relative; display: block;">
        <span style="position: absolute; left: 0; right: 0; top: 3px; border-top: 1px dashed #5c6670;"></span>
        <span style="display: grid; grid-template-columns: repeat(3, 1fr); grid-auto-rows: 35px; gap: 1px;">
          <span style="background: #ffffff; border-radius: 1px;"></span><span style="background: #ffffff; border-radius: 1px;"></span><span style="background: #ffffff; border-radius: 1px;"></span>
          <span style="background: #ffffff; border-radius: 1px;"></span><span style="background: #ffffff; border-radius: 1px;"></span><span style="background: #ffffff; border-radius: 1px;"></span>
          <span style="background: #ffffff; border-radius: 1px;"></span><span style="background: #ffffff; border-radius: 1px;"></span><span style="background: #ffffff; border-radius: 1px;"></span>
        </span>
      </a>
    </div>
    <div class="seg" role="group" aria-label="Orientacja użytku">
      <button type="button" class="on">Auto · 9</button>
      <button type="button">Pion · 9</button>
      <button type="button">Poziom · 8</button>
    </div>
  </section>

  <div style="margin-top: 10px; display: flex; gap: 8px;">
    <a href="App_Karta.dc.html" style="flex: 1; display: flex; align-items: center; justify-content: center; gap: 8px; background: #111111; color: #ffffff; border-radius: 999px; padding: 14px; font-size: 15px; font-weight: 600; min-height: 50px; box-sizing: border-box;">Karta zlecenia<svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><path d="M5 2l5 5-5 5" fill="none" stroke="#ffffff" stroke-width="1.6"/></svg></a>
    <button type="button" aria-label="Zapisz w historii" style="width: 50px; height: 50px; border-radius: 999px; border: 1px solid #dbe0e5; background: #ffffff; display: flex; align-items: center; justify-content: center;"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M3 2h10v12l-5-3-5 3z" fill="none" stroke="#111111" stroke-width="1.5"/></svg></button>
  </div>

  <nav class="tabs" style="margin-top: auto; margin-bottom: 20px;" aria-label="Nawigacja">
    <a href="App_Kalkulator.dc.html" class="tab on"><svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><rect x="3" y="2" width="12" height="14" rx="2" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M6 6h6M6 9.5h2M10 9.5h2M6 13h2M10 13h2" stroke="currentColor" stroke-width="1.5"/></svg>Kalkulator</a>
    <a href="App_Formaty.dc.html" class="tab"><svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><rect x="2.5" y="2.5" width="13" height="13" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M2.5 9h13M9 2.5v13" stroke="currentColor" stroke-width="1.5"/></svg>Biblioteka</a>
    <a href="App_Historia.dc.html" class="tab"><svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><circle cx="9" cy="9" r="6.5" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M9 5v4l3 2" fill="none" stroke="currentColor" stroke-width="1.5"/></svg>Historia</a>
  </nav>
</div>
</x-dc>
